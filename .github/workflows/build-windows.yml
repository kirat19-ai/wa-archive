name: Build Windows installer

# Builds the WA Archive Windows .exe on a real Windows runner and uploads it as a
# downloadable artifact. Run it from the Actions tab ("Run workflow") or on a tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --ignore-scripts: better-sqlite3 v13 and whatsapp-rust-bridge ship
        # prebuilt binaries in their npm packages, so we skip npm's spurious
        # node-gyp compile (which fails to detect the runner's newer Visual
        # Studio). electron-builder downloads the target Electron itself.
        run: npm install --ignore-scripts

      - name: Build web UI (PWA assets bundled into the app)
        run: npm run build:web

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist:win
        env:
          # Personal/unsigned build — do not attempt code signing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish installer to a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la apps/desktop/release
          gh release delete wa-archive-windows --yes --cleanup-tag 2>/dev/null || true
          gh release create wa-archive-windows \
            apps/desktop/release/*.exe apps/desktop/release/*.blockmap \
            --title "WA Archive — Windows installer" \
            --notes "Auto-built Windows installer (unsigned). Download the .exe below and run it. See docs/WINDOWS.md for auto-start setup."
