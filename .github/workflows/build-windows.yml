name: Build Windows installer

# Builds the WA Archive Windows .exe on a real Windows runner and uploads it as a
# downloadable artifact. Run it from the Actions tab ("Run workflow") or on a tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web UI (PWA assets bundled into the app)
        run: npm run build:web

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist:win
        env:
          # Personal/unsigned build — do not attempt code signing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WA-Archive-Windows-Setup
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error
